name: Android test build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./gradlew assembleDebug lintDebug
      - run: |
          mkdir -p /tmp/policy-tests
          javac -d /tmp/policy-tests app/src/main/java/dev/opd2515/audiomanager/Policy.java tests/PolicyTest.java
          java -cp /tmp/policy-tests dev.opd2515.audiomanager.PolicyTest
      - uses: actions/upload-artifact@v4
        with:
          name: OPD2515-Audio-Manager-test
          path: app/build/outputs/apk/debug/app-debug.apk
